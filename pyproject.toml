[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stacktris"
version = "1.0.0"
description = "Generate falling-block tech-stack SVG graphics for your README"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "ZenzerJs" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Graphics",
]

[project.scripts]
stacktris = "stacktris.cli:main"

[tool.setuptools.packages.find]
include = ["stacktris*"]
